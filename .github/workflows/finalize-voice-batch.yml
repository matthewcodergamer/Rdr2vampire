name: Finalize Nightwalker Voice Batch

on:
  push:
    branches:
      - phase-12-clean-voice-library
    paths:
      - scripts/finalize_voice_batch.py
      - .github/workflows/finalize-voice-batch.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Canonicalize uploaded voice library
        run: python3 scripts/finalize_voice_batch.py

      - name: Validate final layout
        shell: bash
        run: |
          test "$(find content/audio -maxdepth 1 -type f -name '*.wav' | wc -l)" -eq 59
          ! find content/audio -maxdepth 1 -type f -name '*voice_batch_1*' | grep -q .
          test "$(grep -c '^asset=' content/Nightwalker.audio)" -eq 59
          ! grep -R 'Let us c$\|behind brick a$\|make one$' content/Nightwalker.dialogue Nightwalker.voice.dialogue
          python3 - <<'PY'
          from pathlib import Path
          import wave
          for p in Path('content/audio').glob('*.wav'):
              with wave.open(str(p), 'rb') as w:
                  assert w.getnchannels() == 1, p
                  assert w.getsampwidth() == 2, p
                  assert w.getframerate() == 44100, p
          PY

      - name: Remove one-shot cleanup machinery
        run: |
          rm scripts/finalize_voice_batch.py
          rm .github/workflows/finalize-voice-batch.yml

      - name: Commit finalized voice library
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Finalize canonical Nightwalker voice library"
          git push origin HEAD:${GITHUB_REF_NAME}
