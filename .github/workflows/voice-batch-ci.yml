name: Voice Batch CI

on:
  push:
    branches: [phase-12-voice-batch-1]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  voice-batch-routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run voice batch routing tests
        run: |
          mkdir -p build/voice-batch-ci
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Iinclude \
            tests/VoiceBatchTests.cpp \
            src/narrative/NarrativeScript.cpp \
            -o build/voice-batch-ci/voice-batch-tests
          ./build/voice-batch-ci/voice-batch-tests
      - name: Parse release packager
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "scripts/package-release.ps1"),
            [ref]$null,
            [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
