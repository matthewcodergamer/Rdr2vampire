name: Narrative Audio CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-audio-manifest:
    name: Linux narrative audio manifest tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run narrative audio tests
        run: |
          mkdir -p build/audio-ci
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Iinclude tests/NarrativeAudioTests.cpp -o build/audio-ci/narrative-audio
          ./build/audio-ci/narrative-audio
      - name: Compile runtime audio composition
        run: |
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Itests/stubs -Iinclude -Isrc/core -c src/core/RuntimeLifecycle.cpp -o build/audio-ci/RuntimeLifecycle.o

  windows-audio-backend:
    name: Windows WAV backend tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build narrative audio tests
        run: msbuild Nightwalker.Audio.Tests.vcxproj /m /p:Configuration=Release /p:Platform=x64
      - name: Run narrative audio tests
        shell: pwsh
        run: .\bin\tests\Release\Nightwalker.Audio.Tests.exe
