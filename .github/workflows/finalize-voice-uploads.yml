name: Finalize Uploaded Voice Library

on:
  push:
    branches: [phase-12-complete-voice-library]
    paths:
      - 'scripts/finalize_voice_uploads.py'
      - 'scripts/finalize_voice_payload.part*.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-12-complete-voice-library
          fetch-depth: 0
      - name: Materialize complete voice integration
        run: python3 scripts/finalize_voice_uploads.py
      - name: Commit completed voice library
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No voice integration changes were required.'
            exit 0
          fi
          git commit -m 'Complete randomized Nightwalker voice library'
          git push origin HEAD:phase-12-complete-voice-library
