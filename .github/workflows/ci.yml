name: Nightwalker CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-pure-tests:
    name: Windows x64 release-candidate tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build foundation tests
        run: msbuild Nightwalker.Tests.vcxproj /m /p:Configuration=Release /p:Platform=x64
      - name: Build Shadowstep safety tests
        run: msbuild Nightwalker.Shadowstep.Tests.vcxproj /m /p:Configuration=Release /p:Platform=x64
      - name: Build presentation tests
        run: msbuild Nightwalker.Presentation.Tests.vcxproj /m /p:Configuration=Release /p:Platform=x64
      - name: Build targeting tests
        run: msbuild Nightwalker.Targeting.Tests.vcxproj /m /p:Configuration=Release /p:Platform=x64
      - name: Build movement tests
        run: msbuild Nightwalker.Movement.Tests.vcxproj /m /p:Configuration=Release /p:Platform=x64
      - name: Build feeding tests
        run: msbuild Nightwalker.Feeding.Tests.vcxproj /m /p:Configuration=Release /p:Platform=x64
      - name: Build combat tests
        run: msbuild Nightwalker.Combat.Tests.vcxproj /m /p:Configuration=Release /p:Platform=x64
      - name: Build encounter tests
        run: msbuild Nightwalker.Encounter.Tests.vcxproj /m /p:Configuration=Release /p:Platform=x64
      - name: Build boss HUD tests
        run: msbuild Nightwalker.BossHud.Tests.vcxproj /m /p:Configuration=Release /p:Platform=x64
      - name: Build save data tests
        run: msbuild Nightwalker.SaveData.Tests.vcxproj /m /p:Configuration=Release /p:Platform=x64
      - name: Build narrative tests
        run: msbuild Nightwalker.Narrative.Tests.vcxproj /m /p:Configuration=Release /p:Platform=x64
      - name: Run pure tests
        shell: pwsh
        run: |
          & .\bin\tests\Release\Nightwalker.Tests.exe
          & .\bin\tests\Release\Nightwalker.Shadowstep.Tests.exe
          & .\bin\tests\Release\Nightwalker.Presentation.Tests.exe
          & .\bin\tests\Release\Nightwalker.Targeting.Tests.exe
          & .\bin\tests\Release\Nightwalker.Movement.Tests.exe
          & .\bin\tests\Release\Nightwalker.Feeding.Tests.exe
          & .\bin\tests\Release\Nightwalker.Combat.Tests.exe
          & .\bin\tests\Release\Nightwalker.Encounter.Tests.exe
          & .\bin\tests\Release\Nightwalker.BossHud.Tests.exe
          & .\bin\tests\Release\Nightwalker.SaveData.Tests.exe
          & .\bin\tests\Release\Nightwalker.Narrative.Tests.exe
      - name: Run release policy audit
        run: python scripts/release_audit.py
      - name: Parse and smoke-test release packager
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\scripts\package-release.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -ne 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          New-Item -ItemType Directory -Path .\build\package-fixture -Force | Out-Null
          Copy-Item .\bin\tests\Release\Nightwalker.Tests.exe .\build\package-fixture\Nightwalker.asi
          & .\scripts\package-release.ps1 -PluginPath .\build\package-fixture\Nightwalker.asi -Version 1.0.0-rc1 -OutputDirectory .\build\package-smoke
          $zip = '.\build\package-smoke\Nightwalker-1.0.0-rc1-win64.zip'
          if (-not (Test-Path $zip)) { throw 'Release packager smoke test did not create expected ZIP.' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip))
          try {
            $names = $archive.Entries | Where-Object { -not [string]::IsNullOrEmpty($_.Name) } | ForEach-Object { $_.FullName.Replace('\', '/') } | Sort-Object
            $expectedCore = @(
              'Nightwalker/CHANGELOG.md',
              'Nightwalker/Nightwalker.asi',
              'Nightwalker/Nightwalker.audio',
              'Nightwalker/Nightwalker.dialogue',
              'Nightwalker/Nightwalker.ini',
              'Nightwalker/Nightwalker.voice.dialogue',
              'Nightwalker/README.md',
              'Nightwalker/THIRD_PARTY_NOTICES.md'
            ) | Sort-Object
            $actualCore = $names | Where-Object { -not $_.StartsWith('Nightwalker/audio/') } | Sort-Object
            if (($actualCore -join '|') -ne ($expectedCore -join '|')) { throw "Unexpected release core entries: $($actualCore -join ', ')" }
            $audioEntries = @($names | Where-Object { $_.StartsWith('Nightwalker/audio/') })
            if ($audioEntries.Count -ne 59) { throw "Expected 59 packaged voice WAVs, found $($audioEntries.Count)." }
            foreach ($audioEntry in $audioEntries) {
              if (-not $audioEntry.EndsWith('.wav')) { throw "Unexpected non-WAV voice payload: $audioEntry" }
              if ($audioEntry -match 'voice_batch_1') { throw "Fallback voice filename survived release packaging: $audioEntry" }
            }
          } finally { $archive.Dispose() }

  linux-pure-tests:
    name: Linux compiler regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run foundation tests
        run: |
          mkdir -p build/ci
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Iinclude -Isrc/core tests/RuntimeFoundationTests.cpp src/core/Config.cpp src/core/ConfigParse.cpp src/core/ConfigValidation.cpp src/core/SafetyWatchdog.cpp src/game/ModelStreamRequest.cpp -o build/ci/foundation
          ./build/ci/foundation
      - name: Build and run Shadowstep safety tests
        run: |
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Iinclude -Isrc/core tests/ShadowstepV1Tests.cpp src/core/Config.cpp src/core/ConfigParse.cpp src/core/ConfigValidation.cpp src/systems/ShadowstepMath.cpp src/systems/ShadowstepResolver.cpp -o build/ci/shadowstep
          ./build/ci/shadowstep
      - name: Build and run presentation tests
        run: |
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Iinclude tests/ShadowstepPresentationTests.cpp src/systems/ShadowstepPresentationSettings.cpp -o build/ci/presentation
          ./build/ci/presentation
      - name: Build and run targeting tests
        run: |
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Iinclude -Isrc/core tests/TargetedShadowstepTests.cpp src/core/Config.cpp src/core/ConfigParse.cpp src/core/ConfigValidation.cpp src/systems/ShadowstepMath.cpp src/systems/ShadowstepResolver.cpp src/systems/TargetedShadowstepPlanner.cpp -o build/ci/targeting
          ./build/ci/targeting
      - name: Build and run movement tests
        run: |
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Iinclude -Isrc/core tests/MovementTests.cpp src/core/Config.cpp src/core/ConfigParse.cpp src/core/ConfigValidation.cpp src/systems/MovementMath.cpp -o build/ci/movement
          ./build/ci/movement
      - name: Build and run feeding tests
        run: |
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Iinclude -Isrc/core tests/FeedingTests.cpp src/core/Config.cpp src/core/ConfigParse.cpp src/core/ConfigValidation.cpp src/systems/FeedingMath.cpp src/systems/HiddenResource.cpp src/systems/VampireFeedPresentation.cpp -o build/ci/feeding
          ./build/ci/feeding
      - name: Build and run combat tests
        run: |
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Iinclude -Isrc/core tests/CombatTests.cpp src/core/Config.cpp src/core/ConfigParse.cpp src/core/ConfigValidation.cpp src/systems/VectorMotionMath.cpp -o build/ci/combat
          ./build/ci/combat
      - name: Build and run encounter tests
        run: |
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Iinclude tests/EncounterTests.cpp src/systems/EncounterMath.cpp src/systems/BossActorRegistry.cpp src/systems/SaintDenisSettingsLoader.cpp -o build/ci/encounter
          ./build/ci/encounter
      - name: Build and run boss HUD tests
        run: |
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Iinclude -Isrc/core tests/BossHudTests.cpp src/ui/BossHudModel.cpp src/core/Config.cpp src/core/ConfigParse.cpp src/core/ConfigValidation.cpp -o build/ci/bosshud
          ./build/ci/bosshud
      - name: Build and run save data tests
        run: |
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Iinclude tests/SaveDataTests.cpp src/core/SaveData.cpp -o build/ci/savedata
          ./build/ci/savedata
      - name: Build and run narrative tests
        run: |
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Iinclude tests/NarrativeTests.cpp src/narrative/NarrativeScript.cpp src/narrative/NarrativePlayback.cpp src/narrative/NarrativeSettingsLoader.cpp -o build/ci/narrative
          ./build/ci/narrative
      - name: Enforce custom HUD draw boundary
        run: |
          hits="$(git grep -n -E 'DRAW_RECT|_BG_DISPLAY_TEXT' -- src || true)"
          bad="$(printf '%s\n' "$hits" | grep -v '^src/game/GameBossBarApi.cpp:' || true)"
          if [ -n "$bad" ]; then
            echo "Unexpected direct custom draw-native use outside GameBossBarApi.cpp:"
            echo "$bad"
            exit 1
          fi
      - name: Run release policy audit
        run: python3 scripts/release_audit.py
      - name: Compile Phase 14 controllers
        run: |
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Iinclude -Isrc/core -c src/systems/ShadowstepController.cpp -o build/ci/ShadowstepController.o
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Iinclude -Isrc/core -c src/systems/ShadowstepPresentation.cpp -o build/ci/ShadowstepPresentation.o
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Iinclude -Isrc/core -c src/systems/VampireAIControllerMain.cpp -o build/ci/VampireAIControllerMain.o
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Iinclude -Isrc/core -c src/systems/VampireAIControllerShadowstep.cpp -o build/ci/VampireAIControllerShadowstep.o
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Iinclude -Isrc/core -c src/systems/VampireAIControllerLifecycle.cpp -o build/ci/VampireAIControllerLifecycle.o
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Iinclude -Isrc/core -c src/systems/MovementController.cpp -o build/ci/MovementController.o
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Iinclude -Isrc/core -c src/systems/FeedingController.cpp -o build/ci/FeedingController.o
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Iinclude -Isrc/core -c src/systems/VampireFeedPresentation.cpp -o build/ci/VampireFeedPresentation.o
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Iinclude -Isrc/core -c src/systems/VampireCombatController.cpp -o build/ci/VampireCombatController.o
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Iinclude -Isrc/core -c src/systems/DebugVampireSpawnerCore.cpp -o build/ci/DebugVampireSpawnerCore.o
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Iinclude -Isrc/core -c src/systems/DebugVampireSpawnerSpawn.cpp -o build/ci/DebugVampireSpawnerSpawn.o
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Iinclude -Isrc/core -c src/systems/DebugVampireSpawnerCleanup.cpp -o build/ci/DebugVampireSpawnerCleanup.o
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Iinclude -Isrc/core -c src/systems/SaintDenisDirectorCore.cpp -o build/ci/SaintDenisDirectorCore.o
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Iinclude -Isrc/core -c src/systems/SaintDenisDirectorUpdate.cpp -o build/ci/SaintDenisDirectorUpdate.o
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Iinclude -Isrc/core -c src/systems/SaintDenisDirectorSetup.cpp -o build/ci/SaintDenisDirectorSetup.o
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Iinclude -Isrc/core -c src/systems/SaintDenisDirectorActive.cpp -o build/ci/SaintDenisDirectorActive.o
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Iinclude -Isrc/core -c src/systems/SaintDenisDirectorFinish.cpp -o build/ci/SaintDenisDirectorFinish.o
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Iinclude -Isrc/core -c src/systems/SaintDenisDirectorLifecycle.cpp -o build/ci/SaintDenisDirectorLifecycle.o
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Iinclude -Isrc/core -c src/systems/ProgressionController.cpp -o build/ci/ProgressionController.o
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Itests/stubs -Iinclude -Isrc/core -c src/narrative/NarrativeController.cpp -o build/ci/NarrativeController.o
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Iinclude -Isrc/core -c src/ui/BossHudController.cpp -o build/ci/BossHudController.o
      - name: Compile Phase 14 runtime composition
        run: |
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Itests/stubs -Iinclude -Isrc/core -c src/core/RuntimeLifecycle.cpp -o build/ci/RuntimeLifecycle.o
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Itests/stubs -Iinclude -Isrc/core -c src/core/RuntimeTick.cpp -o build/ci/RuntimeTick.o
      - name: Compile native boundaries
        run: |
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Itests/stubs -Iinclude -c src/game/GamePresentationApi.cpp -o build/ci/GamePresentationApi.o
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Itests/stubs -Iinclude -c src/game/GameCombatApi.cpp -o build/ci/GameCombatApi.o
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Itests/stubs -Iinclude -c src/game/GameMovementApi.cpp -o build/ci/GameMovementApi.o
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Itests/stubs -Iinclude -c src/game/GameFeedingApi.cpp -o build/ci/GameFeedingApi.o
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Itests/stubs -Iinclude -c src/game/GameFeedingStyled.cpp -o build/ci/GameFeedingStyled.o
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Itests/stubs -Iinclude -c src/game/GamePhysicalApi.cpp -o build/ci/GamePhysicalApi.o
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Itests/stubs -Iinclude -c src/game/GameEncounterApi.cpp -o build/ci/GameEncounterApi.o
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Itests/stubs -Iinclude -c src/game/GameBossBarApi.cpp -o build/ci/GameBossBarApi.o

  sdk-boundary-note:
    name: Native plugin SDK boundary
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Nightwalker.asi is intentionally not linked in public CI."
          echo "The plugin requires the local Script Hook RDR2 SDK and Windows/MSVC."
          echo "CI validates Phase 14 release policy, deterministic regressions, packaging smoke checks, controllers, runtime composition and native boundaries."
