name: Build Nightwalker ASI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-asi:
    name: Windows Release x64 ASI
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Nightwalker
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Download official SDK, build and package Nightwalker.asi
        shell: pwsh
        run: |
          ./scripts/build-asi.ps1 -Configuration Release

      - name: Verify packaged ASI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $asi = 'dist\Nightwalker\Nightwalker.asi'
          if (!(Test-Path $asi)) { throw 'Nightwalker.asi was not packaged.' }
          $item = Get-Item $asi
          if ($item.Length -le 0) { throw 'Nightwalker.asi is empty.' }
          Write-Host "Nightwalker.asi size: $($item.Length) bytes"
          Get-FileHash -Algorithm SHA256 $asi | Format-List

      - name: Upload Nightwalker release package
        uses: actions/upload-artifact@v4
        with:
          name: Nightwalker-Release-x64-${{ github.sha }}
          path: dist/Nightwalker/
          if-no-files-found: error
          retention-days: 30
