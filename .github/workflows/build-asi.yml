name: Build Nightwalker ASI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-nightwalker-asi:
    name: Build Nightwalker ASI
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Nightwalker
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Download official Script Hook RDR2 developer SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sdkUrl = 'https://www.dev-c.com/files/ScriptHookRDR2_SDK_1.0.1207.73.zip'
          $zipPath = Join-Path $env:RUNNER_TEMP 'ScriptHookRDR2_SDK.zip'
          $extractPath = Join-Path $env:RUNNER_TEMP 'ScriptHookRDR2_SDK'

          Write-Host "Downloading the official Script Hook RDR2 developer SDK from dev-c.com..."
          Invoke-WebRequest -Uri $sdkUrl -OutFile $zipPath -Headers @{ 'User-Agent' = 'Mozilla/5.0 Nightwalker-GitHub-Actions' }

          if (!(Test-Path $zipPath) -or (Get-Item $zipPath).Length -lt 1024) {
            throw 'The Script Hook RDR2 SDK download is missing or unexpectedly small.'
          }

          if (Test-Path $extractPath) { Remove-Item $extractPath -Recurse -Force }
          Expand-Archive -Path $zipPath -DestinationPath $extractPath -Force

          $mainHeader = Get-ChildItem -Path $extractPath -Recurse -File -Filter 'main.h' | Select-Object -First 1
          $nativesHeader = Get-ChildItem -Path $extractPath -Recurse -File -Filter 'natives.h' | Select-Object -First 1
          $importLibrary = Get-ChildItem -Path $extractPath -Recurse -File -Filter 'ScriptHookRDR2.lib' | Select-Object -First 1

          if ($null -eq $mainHeader) { throw 'Official SDK archive did not contain main.h.' }
          if ($null -eq $nativesHeader) { throw 'Official SDK archive did not contain natives.h.' }
          if ($null -eq $importLibrary) { throw 'Official SDK archive did not contain ScriptHookRDR2.lib.' }

          $sdkRoot = Join-Path $env:GITHUB_WORKSPACE 'third_party\ScriptHookRDR2'
          $incOut = Join-Path $sdkRoot 'inc'
          $libOut = Join-Path $sdkRoot 'lib'
          New-Item -ItemType Directory -Force -Path $incOut, $libOut | Out-Null

          Copy-Item -Path (Join-Path $mainHeader.Directory.FullName '*') -Destination $incOut -Recurse -Force
          Copy-Item -Path (Join-Path $importLibrary.Directory.FullName '*') -Destination $libOut -Recurse -Force

          if (!(Test-Path (Join-Path $incOut 'main.h'))) { throw 'SDK staging failed: main.h missing.' }
          if (!(Test-Path (Join-Path $incOut 'natives.h'))) { throw 'SDK staging failed: natives.h missing.' }
          if (!(Test-Path (Join-Path $libOut 'ScriptHookRDR2.lib'))) { throw 'SDK staging failed: ScriptHookRDR2.lib missing.' }

          Write-Host 'Official Script Hook RDR2 SDK staged successfully.'

      - name: Build Nightwalker Release x64 ASI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          msbuild Nightwalker.vcxproj /m /p:Configuration=Release /p:Platform=x64 /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { throw "MSBuild failed with exit code $LASTEXITCODE." }

          $asi = Join-Path $env:GITHUB_WORKSPACE 'bin\Release\Nightwalker.asi'
          if (!(Test-Path $asi)) { throw 'Build completed without bin/Release/Nightwalker.asi.' }
          $file = Get-Item $asi
          if ($file.Length -le 0) { throw 'Nightwalker.asi is empty.' }
          Write-Host "Nightwalker.asi built successfully: $($file.Length) bytes"
          Get-FileHash $asi -Algorithm SHA256 | Format-List

      - name: Assemble downloadable Nightwalker package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Join-Path $env:GITHUB_WORKSPACE 'dist\Nightwalker'
          New-Item -ItemType Directory -Force -Path $package | Out-Null

          Copy-Item 'bin\Release\Nightwalker.asi' (Join-Path $package 'Nightwalker.asi') -Force
          Copy-Item 'config\Nightwalker.example.ini' (Join-Path $package 'Nightwalker.ini') -Force
          if (Test-Path 'content\Nightwalker.dialogue') {
            Copy-Item 'content\Nightwalker.dialogue' (Join-Path $package 'Nightwalker.dialogue') -Force
          }
          Copy-Item 'README.md' (Join-Path $package 'README.md') -Force

          $hash = (Get-FileHash (Join-Path $package 'Nightwalker.asi') -Algorithm SHA256).Hash
          "Nightwalker.asi SHA256=$hash" | Set-Content (Join-Path $package 'SHA256.txt')

          Write-Host 'Package contents:'
          Get-ChildItem $package | Format-Table Name, Length

      - name: Upload Nightwalker ASI
        uses: actions/upload-artifact@v4
        with:
          name: Nightwalker-ASI
          path: dist/Nightwalker/
          if-no-files-found: error
          retention-days: 30
