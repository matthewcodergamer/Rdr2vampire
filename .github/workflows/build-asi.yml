name: Build Nightwalker ASI

on:
  workflow_dispatch:
  push:
    branches: [main, build-real-nightwalker-asi]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-asi:
    name: Windows Release x64 ASI
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Checkout Nightwalker
        uses: actions/checkout@v4

      - name: Set up Visual Studio 2022 MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[17.0,18.0)'

      - name: Download official SDK, build and package Nightwalker.asi
        shell: pwsh
        run: |
          ./scripts/build-asi.ps1 -Configuration Release

      - name: Verify packaged ASI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $asi = 'dist\Nightwalker\Nightwalker.asi'
          if (!(Test-Path $asi -PathType Leaf)) { throw 'Nightwalker.asi was not packaged.' }
          $item = Get-Item $asi
          if ($item.Length -lt 4096) { throw "Nightwalker.asi is unexpectedly small ($($item.Length) bytes)." }
          $bytes = [System.IO.File]::ReadAllBytes($item.FullName)
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw 'Nightwalker.asi is not a Windows PE image.' }
          Write-Host "Nightwalker.asi size: $($item.Length) bytes"
          Get-FileHash -Algorithm SHA256 $asi | Format-List

      - name: Upload Nightwalker release package
        uses: actions/upload-artifact@v4
        with:
          name: Nightwalker-Release-x64-${{ github.sha }}
          path: dist/Nightwalker/
          if-no-files-found: error
          retention-days: 30
