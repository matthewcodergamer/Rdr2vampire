name: Build Nightwalker ASI
run-name: Build Nightwalker ASI • ${{ github.ref_name }} • #${{ github.run_number }}

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-asi.yml'
      - 'Nightwalker.vcxproj'
      - 'src/**'
      - 'include/**'
      - 'scripts/**'
      - 'config/Nightwalker.example.ini'
      - 'content/Nightwalker.dialogue'
      - 'content/Nightwalker.audio'
      - 'content/Vam-*.mp3'
      - 'Nightwalker.voice.dialogue'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'THIRD_PARTY_NOTICES.md'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-asi.yml'
      - 'Nightwalker.vcxproj'
      - 'src/**'
      - 'include/**'
      - 'scripts/**'
      - 'content/**'
      - 'Nightwalker.voice.dialogue'

permissions:
  contents: read

jobs:
  build-nightwalker-asi:
    name: Build install-ready Nightwalker
    runs-on: windows-2022

    steps:
      - name: Checkout Nightwalker
        uses: actions/checkout@v4

      - name: Setup Visual Studio 2022 MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[17.0,18.0)'

      - name: Acquire Script Hook RDR2 developer SDK
        shell: pwsh
        env:
          SDK_URL_OVERRIDE: ${{ vars.SCRIPHOOK_SDK_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          $officialUrl = $env:SDK_URL_OVERRIDE
          if ([string]::IsNullOrWhiteSpace($officialUrl)) {
            $officialUrl = 'https://www.dev-c.com/files/ScriptHookRDR2_SDK_1.0.1207.73.zip'
          }
          if (-not $officialUrl.StartsWith('https://')) {
            throw 'The Script Hook RDR2 SDK URL must use HTTPS.'
          }

          $zip = Join-Path $env:RUNNER_TEMP 'ScriptHookRDR2_SDK.zip'
          $extract = Join-Path $env:RUNNER_TEMP 'ScriptHookRDR2_SDK'
          Remove-Item $zip -Force -ErrorAction SilentlyContinue
          Remove-Item $extract -Recurse -Force -ErrorAction SilentlyContinue

          & curl.exe --fail --location --retry 2 --retry-delay 2 `
            --user-agent 'Mozilla/5.0' `
            --referer 'https://www.dev-c.com/scripthookrdr2/' `
            --output $zip "$officialUrl"
          $curlExit = $LASTEXITCODE

          $isZip = $false
          if ($curlExit -eq 0 -and (Test-Path $zip -PathType Leaf)) {
            $bytes = [System.IO.File]::ReadAllBytes($zip)
            $isZip = $bytes.Length -ge 4 -and $bytes[0] -eq 0x50 -and $bytes[1] -eq 0x4B
          }

          if ($isZip) {
            New-Item -ItemType Directory -Force -Path $extract | Out-Null
            Expand-Archive -Path $zip -DestinationPath $extract -Force
          } else {
            Write-Warning 'Official SDK download was unavailable; using the pinned public Director''s Suite SDK copy.'
            New-Item -ItemType Directory -Force -Path $extract | Out-Null
            git -C $extract init
            git -C $extract remote add origin https://github.com/VideoTechUK/DirectorsSuite.git
            git -C $extract fetch --depth 1 origin 2bf299ec2264302f5f89403c779899f7f1616896
            git -C $extract checkout --detach FETCH_HEAD
          }

      - name: Install Script Hook RDR2 SDK for this runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $extract = Join-Path $env:RUNNER_TEMP 'ScriptHookRDR2_SDK'
          $target = 'third_party\ScriptHookRDR2'
          $includeDir = Get-ChildItem $extract -Recurse -Directory | Where-Object {
            (Test-Path (Join-Path $_.FullName 'main.h')) -and
            (Test-Path (Join-Path $_.FullName 'natives.h'))
          } | Select-Object -First 1
          $library = Get-ChildItem $extract -Recurse -File -Filter ScriptHookRDR2.lib | Select-Object -First 1
          if (!$includeDir) { throw 'SDK include directory containing main.h and natives.h was not found.' }
          if (!$library) { throw 'ScriptHookRDR2.lib was not found.' }
          New-Item -ItemType Directory -Force "$target\inc" | Out-Null
          New-Item -ItemType Directory -Force "$target\lib" | Out-Null
          Copy-Item "$($includeDir.FullName)\*" "$target\inc\" -Recurse -Force
          Copy-Item $library.FullName "$target\lib\ScriptHookRDR2.lib" -Force

      - name: Validate complete voice library
        run: python tests/validate_complete_voice_library.py

      - name: Build Nightwalker Release x64
        shell: pwsh
        run: |
          msbuild Nightwalker.vcxproj /m /p:Configuration=Release /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Nightwalker ASI
        shell: pwsh
        run: |
          $path = 'bin\Release\Nightwalker.asi'
          if (!(Test-Path $path -PathType Leaf)) { throw 'Nightwalker.asi was not produced.' }
          $asi = Get-Item $path
          if ($asi.Length -lt 4096) { throw "Nightwalker.asi is unexpectedly small ($($asi.Length) bytes)." }
          $bytes = [System.IO.File]::ReadAllBytes($asi.FullName)
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw 'Nightwalker.asi is not a Windows PE image.' }

      - name: Build install-ready package with all voice assets
        shell: pwsh
        run: |
          $output = 'github-build'
          Remove-Item $output -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          & .\scripts\package-release.ps1 `
            -PluginPath .\bin\Release\Nightwalker.asi `
            -Version 1.0.0-rc1 `
            -RepositoryRoot . `
            -OutputDirectory $output
          $source = Join-Path $output 'Nightwalker-1.0.0-rc1-win64.zip'
          $destination = Join-Path $output 'Nightwalker-Windows-x64.zip'
          Copy-Item $source $destination -Force
          $hash = (Get-FileHash .\bin\Release\Nightwalker.asi -Algorithm SHA256).Hash
          "SHA256 Nightwalker.asi: $hash" | Set-Content (Join-Path $output 'Nightwalker.asi.sha256.txt')
          "## Nightwalker build complete" >> $env:GITHUB_STEP_SUMMARY
          "The artifact contains the ASI, dialogue catalogs, manifest, and every mapped MP3 voice asset." >> $env:GITHUB_STEP_SUMMARY
          ("SHA256: " + $hash) >> $env:GITHUB_STEP_SUMMARY

      - name: Upload Nightwalker install package
        uses: actions/upload-artifact@v4
        with:
          name: Nightwalker-ASI
          path: github-build/
          if-no-files-found: error
          retention-days: 30
