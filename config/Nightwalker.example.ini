; Nightwalker reference defaults.
; Copy this file beside Nightwalker.asi as Nightwalker.ini to override defaults.
; Older keys remain accepted where documented for backwards compatibility.
; Phase 11+ runtime state is stored separately in Nightwalker.state. This INI remains
; owner-authored configuration; Nightwalker never writes progression into this file.

[General]
Enabled=true
DebugMode=false
NightOnlyPowers=true
; Phase 13 recovery thresholds are conservative internal safety limits and are
; intentionally not user-tunable, so config conflicts cannot disable fail-safe cleanup.

[Debug]
Enabled=false
ProfileRuntime=false
ShadowstepHotkey=0x76
ReloadHotkey=0x79
RestoreHotkey=0x7A
; ProfileRuntime logs fixed-slot per-system update count/average/max timing every 10s.
; It is ignored unless Debug.Enabled=true and allocates no per-frame profile containers.
; Fixed debug harness keys: F1 heavy strike, F2 short grab, F3 physical release,
; F4 combat feed, F5 sip, F6 drain, F8 spawn, F9 despawn.

[Shadowstep]
Enabled=true
QuickDistance=6.5
AimDistance=9.0
CombatFlankDistance=1.6
CooldownMs=550
ValidationTimeoutMs=250
WallClearance=0.65
MaxVerticalDelta=1.5
; Legacy alias still accepted: MaxVerticalRise=1.5
CombatCooldownMs=700
DisappearMs=110
ArrivalCarryMeters=1.25
ArrivalCarryMs=140
MeleeBufferMs=220
StateTimeoutMs=1000
SmokeFx=true
StaminaCostPercent=8.0
HungerCost=1.5
AllowCombatTargeting=true

[VampireAI]
Enabled=true
ShadowstepMinDistance=4.0
ShadowstepMaxDistance=10.0
StrikingRange=1.65
PredictionMs=250
DecisionIntervalMs=180
ShadowstepCooldownMs=2400
TelegraphMs=320
RecoveryMs=850
EvadeCooldownMs=5000
RetreatSpeedThreshold=0.55

[Movement]
Enabled=true
SprintMoveRate=1.15
AccelerationMs=350
BurstDurationMs=1800
RecoveryMs=900
DismountRecoveryMs=500
ActivationDistance=4.5
MinVelocity=0.30
TrailFx=true
TrailIntervalMs=180
; Enemy sprint does not alter the player's gameplay camera.

[Feeding]
Enabled=true
AllowNonLethal=true
AllowAnimalFeeding=false
HiddenBloodEnabled=true
InitialBlood=50.0
SipBloodGain=20.0
DrainBloodGain=55.0
HealthRestoreSip=15
HealthRestoreDrain=45
MaxDistance=1.70
AlignMs=350
GrabMs=450
SipDurationMs=1200
DrainDurationMs=1800
ReleaseMs=250
StateTimeoutMs=3500
; Legacy aliases still accepted: HungerRestoreSip / HungerRestoreDrain.
; InitialBlood seeds a missing/new state file. Once Nightwalker.state exists, its bounded
; resource.blood value is the restart-persistent runtime value.
; The internal blood/hunger value is never exposed as a custom HUD meter.

[Combat]
Enabled=true
MaxDistance=2.25
HeavyWindupMs=260
ShadowstepFollowupWindupMs=120
StrikeWindowMs=700
RecoveryMs=600
GrabAlignMs=300
GrabHoldMs=400
BiteHoldMs=500
ThrowRagdollMs=1200
StateTimeoutMs=4500
StrikeBonus=8
BiteDamage=18
BiteHeal=10
BiteBloodGain=12.0
StrikeMoveRate=1.08
ThrowHorizontalForce=1.35
ThrowUpForce=0.28
ThrowProjectionMeters=2.25
BossSpecialCooldownMs=2800
; Bite* keys are accepted aliases for the internal CombatFeed* settings.
; No move names, cooldowns or resource values are drawn as custom HUD.

[Encounter.SaintDenis]
Enabled=true
UseExistingVampirePed=true
PedModel=cs_vampire
StartHour=0
EndHour=4
RespawnCooldownHours=24
; Default center is the documented Saint Denis church/cathedral exterior area.
CenterX=2741.01245
CenterY=-1263.93384
CenterZ=50.61435
TriggerRadius=70.0
AbortRadius=115.0
SpawnMinDistance=18.0
SpawnMaxDistance=55.0
ConfrontationDistance=18.0
EligibilityPollMs=500
OmenDurationMs=2600
OmenPulseMs=850
SpawnRetryMs=450
SpawnTimeoutMs=9000
StalkingMs=5000
ConfrontationMs=900
LeaveGraceMs=7000
ResolutionHoldMs=1500
AbortCooldownMinutes=10
; Completion and the absolute encounter cooldown are persisted in Nightwalker.state.
; Omen V1 uses restrained existing smoke only; no guessed bell/scream/bat asset names are shipped.

[Narrative]
Enabled=true
MaxConfrontationHoldMs=6000
MaxSequenceMs=9000
SkipKey=0x0D
OptionalAudio=true
; Enter skips the current subtitle line only while a narrative sequence is active.
; Nightwalker.dialogue is copied beside the ASI by local builds; built-in original text is the fallback.
; Optional audio IDs are metadata only in Phase 12. Missing audio never blocks subtitles or cleanup.

[BossHUD]
Enabled=true
DisplayName=THE VAMPIRE
IdleSeconds=6.0
FadeSeconds=0.35
DeathHoldSeconds=1.25
ShowNumericHealth=false
; This temporary red boss bar is the ONLY custom combat HUD Nightwalker adds.
; Numeric HP is opt-in only. No powers, phases, weaknesses, cooldowns or move names are drawn.

[VFX]
Smoke=true
Bats=true
MaxTemporaryBats=3
CameraEffects=true

[Accessibility]
ReduceCameraShake=false
ReduceBlood=false
DisableBatEntities=false
